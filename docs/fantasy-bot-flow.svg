<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Esquema operativo del Fantasy Bot IA</title>
  <desc id="desc">Diagrama del flujo del bot de LaLiga Fantasy: entradas, programacion, grafo LangGraph, herramientas y acciones.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-dark" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#157f61"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#b42318"/>
    </marker>
    <style>
      .bg { fill: #f6f7fb; }
      .title { font: 800 42px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 21px Arial, Helvetica, sans-serif; fill: #475569; }
      .section { font: 800 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #111827; }
      .text { font: 400 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny { font: 700 13px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .note { font: 700 16px Arial, Helvetica, sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #d7deea; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .soft { fill: #ffffff; stroke: #d7deea; stroke-width: 2; rx: 14; }
      .input { fill: #eef6ff; stroke: #91c5f8; }
      .schedule { fill: #fff4e5; stroke: #f2b764; }
      .graph { fill: #f3f0ff; stroke: #b7a6f6; }
      .tool { fill: #ecfdf5; stroke: #79c7a2; }
      .action { fill: #fff1f2; stroke: #f0a1aa; }
      .output { fill: #f0f9ff; stroke: #73b9dc; }
      .guard { fill: #f8fafc; stroke: #cbd5e1; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow-dark); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-dark); }
      .line-green { fill: none; stroke: #157f61; stroke-width: 3; marker-end: url(#arrow-green); }
      .line-red { fill: none; stroke: #b42318; stroke-width: 3; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>

  <text class="title" x="70" y="76">Fantasy Bot IA: esquema de funcionamiento</text>
  <text class="subtitle" x="70" y="112">LaLiga Fantasy con Telegram, daemon 24/7, predicción xGBoost y agente LangGraph por ciclos.</text>

  <!-- Main containers -->
  <rect class="card" x="54" y="150" width="370" height="830"/>
  <text class="section" x="84" y="195">1. Entradas y disparadores</text>

  <rect class="card" x="470" y="150" width="660" height="830"/>
  <text class="section" x="500" y="195">2. Ciclo inteligente LangGraph</text>

  <rect class="card" x="1176" y="150" width="370" height="830"/>
  <text class="section" x="1206" y="195">3. Ejecución y salida</text>

  <!-- Inputs column -->
  <rect class="soft input" x="84" y="230" width="310" height="118"/>
  <text class="label" x="110" y="267">Telegram</text>
  <text class="text" x="110" y="297">Token JWT y selección de liga</text>
  <text class="small" x="110" y="322">/ligas · /liga · /informe</text>

  <rect class="soft input" x="84" y="380" width="310" height="122"/>
  <text class="label" x="110" y="417">API LaLiga Fantasy</text>
  <text class="text" x="110" y="447">Plantilla, saldo, mercado,</text>
  <text class="text" x="110" y="474">rivales y alineación actual</text>

  <rect class="soft input" x="84" y="535" width="310" height="122"/>
  <text class="label" x="110" y="572">Datos locales</text>
  <text class="text" x="110" y="602">Scrapes de lesiones, sanciones,</text>
  <text class="text" x="110" y="629">apercibidos y valores</text>

  <rect class="soft input" x="84" y="690" width="310" height="122"/>
  <text class="label" x="110" y="727">Modelo predictivo</text>
  <text class="text" x="110" y="757">xGBoost calcula xP para</text>
  <text class="text" x="110" y="784">la próxima jornada</text>

  <rect class="soft schedule" x="84" y="845" width="310" height="88"/>
  <text class="label" x="110" y="881">Daemon 24/7</text>
  <text class="text" x="110" y="911">PRE, POST y alineación D-1</text>

  <!-- Schedule strip -->
  <rect class="soft schedule" x="500" y="230" width="600" height="95"/>
  <text class="label" x="528" y="268">Ventanas operativas</text>
  <text class="text" x="528" y="299">PRE: 10 min antes del cierre · POST: 10 min después · Alineación: 23h55 antes del primer partido</text>

  <!-- Graph nodes -->
  <rect class="soft graph" x="530" y="370" width="245" height="126"/>
  <text class="label" x="560" y="408">contexto</text>
  <text class="text" x="560" y="438">Carga estado global con</text>
  <text class="text" x="560" y="465">tools reales del repo</text>

  <rect class="soft graph" x="825" y="370" width="245" height="126"/>
  <text class="label" x="855" y="408">analista</text>
  <text class="text" x="855" y="438">Evalúa plantilla propia,</text>
  <text class="text" x="855" y="465">riesgos y cláusulas</text>

  <rect class="soft graph" x="530" y="545" width="245" height="126"/>
  <text class="label" x="560" y="583">ojeador</text>
  <text class="text" x="560" y="613">Busca chollos, mercado,</text>
  <text class="text" x="560" y="640">clausulazos y evitables</text>

  <rect class="soft graph" x="825" y="545" width="245" height="126"/>
  <text class="label" x="855" y="583">manager</text>
  <text class="text" x="855" y="613">Cruza informes y valida</text>
  <text class="text" x="855" y="640">saldo, fase e ids</text>

  <rect class="soft graph" x="530" y="720" width="245" height="126"/>
  <text class="label" x="560" y="758">ejecutor</text>
  <text class="text" x="560" y="788">Simula o ejecuta solo</text>
  <text class="text" x="560" y="815">acciones permitidas</text>

  <rect class="soft graph" x="825" y="720" width="245" height="126"/>
  <text class="label" x="855" y="758">final</text>
  <text class="text" x="855" y="788">Devuelve JSON con decisión,</text>
  <text class="text" x="855" y="815">acciones y riesgos</text>

  <!-- Tool row -->
  <rect class="soft tool" x="500" y="885" width="600" height="62"/>
  <text class="note" x="530" y="923">Tools clave: snapshot_summary · my_squad · market_opportunities · news_reader_tool · simulate_transfer_plan · current_lineup</text>

  <!-- Right column actions -->
  <rect class="soft guard" x="1206" y="230" width="310" height="108"/>
  <text class="label" x="1232" y="267">Modo seguro</text>
  <text class="text" x="1232" y="297">/informe y PRE generan plan</text>
  <text class="text" x="1232" y="322">en dry-run antes de tocar nada</text>

  <rect class="soft action" x="1206" y="380" width="310" height="170"/>
  <text class="label" x="1232" y="417">Compraventa</text>
  <text class="text" x="1232" y="447">Vender jugadores</text>
  <text class="text" x="1232" y="474">Pujar en mercado</text>
  <text class="text" x="1232" y="501">Clausulazos</text>
  <text class="text" x="1232" y="528">Subir cláusulas clave</text>

  <rect class="soft action" x="1206" y="590" width="310" height="130"/>
  <text class="label" x="1232" y="627">POST mercado</text>
  <text class="text" x="1232" y="657">Aceptar ofertas cerradas</text>
  <text class="text" x="1232" y="684">y ajustes post-cierre</text>

  <rect class="soft action" x="1206" y="755" width="310" height="110"/>
  <text class="label" x="1232" y="792">Alineación</text>
  <text class="text" x="1232" y="822">Mejor once por xP</text>
  <text class="text" x="1232" y="849">y capitán automático</text>

  <rect class="soft output" x="1206" y="900" width="310" height="48"/>
  <text class="label" x="1232" y="931">Telegram informa resultado</text>

  <!-- Arrows from inputs -->
  <path class="line-soft" d="M394 289 C430 289 449 275 500 275"/>
  <path class="line-soft" d="M394 441 C435 441 463 420 530 420"/>
  <path class="line-soft" d="M394 596 C435 596 463 592 530 592"/>
  <path class="line-soft" d="M394 751 C435 751 463 781 530 781"/>
  <path class="line-soft" d="M394 889 C435 889 458 916 500 916"/>

  <!-- Graph arrows -->
  <path class="line" d="M775 433 L825 433"/>
  <path class="line" d="M948 496 C948 516 708 516 708 545"/>
  <path class="line" d="M775 608 L825 608"/>
  <path class="line" d="M948 671 C948 695 708 692 708 720"/>
  <path class="line" d="M775 783 L825 783"/>

  <!-- Outgoing arrows -->
  <path class="line-green" d="M1070 783 C1132 783 1145 284 1206 284"/>
  <path class="line-green" d="M1070 783 C1130 783 1148 465 1206 465"/>
  <path class="line-green" d="M1070 783 C1134 783 1149 655 1206 655"/>
  <path class="line-green" d="M1070 783 C1136 783 1149 810 1206 810"/>
  <path class="line-soft" d="M1361 865 L1361 900"/>

  <!-- Manual command side notes -->
  <rect x="123" y="245" width="74" height="24" rx="12" fill="#2f80ed"/>
  <text class="tiny" x="140" y="262">MANUAL</text>
  <rect x="102" y="860" width="66" height="24" rx="12" fill="#d97706"/>
  <text class="tiny" x="119" y="877">AUTO</text>
  <rect x="1225" y="244" width="66" height="24" rx="12" fill="#64748b"/>
  <text class="tiny" x="1242" y="261">CACHE</text>

  <!-- Safety rule notes -->
  <rect class="soft guard" x="500" y="1000" width="1016" height="62"/>
  <text class="note" x="530" y="1037">Reglas de control: en POST no compra ni vende · dry-run no toca mercado real · no inventa ids · sube cláusulas solo en jugadores clave y expuestos · 1M invertido sube 2M de cláusula</text>
</svg>
